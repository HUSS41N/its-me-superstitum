<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Md Hussain</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6">
    <link rel="stylesheet" href="/fonts/fonts.css?v=1">
    <style>
        :root { --bg:#0b0b0d; --ink:#ededf0; --muted:#9a9aa6; --accent:#8a7bff; }
        @media (prefers-color-scheme: light) { :root { --bg:#faf9f7; --ink:#16161a; --muted:#5d5d68; } }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; text-align:center; }
        .code { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:13px; letter-spacing:.12em; color:var(--accent); }
        h1 { font-size:clamp(32px, 6vw, 56px); line-height:1.05; margin:14px 0 12px; letter-spacing:-.02em; }
        h1 em { font-family:"Instrument Serif", Georgia, serif; font-weight:400; }
        p { color:var(--muted); margin:0 0 28px; font-size:16px; }
        a { display:inline-block; padding:12px 22px; border-radius:999px; background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; font-size:14px; }
    </style>
</head>
<body>
    <main>
        <div class="code">404 · NOT FOUND</div>
        <h1>This page wandered <em>off</em>.</h1>
        <p>It doesn't exist, or it moved.</p>
        <a href="/">Back to the portfolio</a>
    </main>
</body>
</html>
